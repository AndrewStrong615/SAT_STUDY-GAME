<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06203c">
<title>Twin Tank Dive</title>
<!--
  Twin Tank Dive. Double-click this file to play. No install, no build.
    index.html  markup and styles (this file)
    skills.js   the list of SAT domains and skills (edit names there)
    game.js     logic, scoring, live questions, visuals, sound, storage
-->
<style>
:root {
  --bg: #04121f; --panel: #0a2136; --panel-2: #0f2c47; --line: #1d4263;
  --text: #e9f4ff; --muted: #9db7cf; --accent: #5fe3ff;
  --engine: #ffb14a; --light: #ffe66b; --good: #4fd98b; --bad: #ff6b7a; --gold: #ffd84d;
  --radius: 14px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1 { font-size: 26px; margin: 4px 0 6px; letter-spacing: .2px; }
h2 { font-size: 20px; margin: 18px 0 4px; }
h3 { font-size: 13px; margin: 16px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
p { margin: 8px 0; }
.lead { color: var(--muted); margin-bottom: 14px; }
.tiny { font-size: 13px; color: var(--muted); }

/* ---------- layout ---------- */
.scene { position: relative; height: 31vh; min-height: 180px; max-height: 300px; overflow: hidden; background: #0c78a8; }
.scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.topbar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) 10px 8px; z-index: 3; }
.topbar button { background: rgba(3, 18, 32, .55); border: 1px solid rgba(255, 255, 255, .22); border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 600; min-height: 34px; white-space: nowrap; backdrop-filter: blur(4px); }
.topbar .brand { font-weight: 800; letter-spacing: .3px; }
.topbar nav { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.zone { position: absolute; left: 12px; bottom: 10px; z-index: 3; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, .7); }
.reveal { position: absolute; left: 0; right: 0; bottom: 30px; z-index: 3; text-align: center; pointer-events: none; opacity: 0; transform: translateY(10px) scale(.92); transition: opacity .35s, transform .35s; text-shadow: 0 2px 10px rgba(0, 0, 0, .8); }
.reveal.show { opacity: 1; transform: none; }
.reveal b { display: block; font-size: clamp(24px, 7vw, 40px); line-height: 1.1; }
.reveal span { font-weight: 700; color: var(--accent); }
.reveal.gold b { color: var(--gold); }

.gauges { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 12px; background: rgba(4, 18, 31, .96); border-bottom: 1px solid var(--line); }
.g-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
.g-head b { font-size: 17px; letter-spacing: 0; }
.engine .g-head b { color: var(--engine); } .lightg .g-head b { color: var(--light); }
.g-bar { height: 9px; border-radius: 99px; background: #12304b; overflow: hidden; margin-top: 3px; }
.g-bar i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.engine .g-bar i { background: linear-gradient(90deg, #ff7a3d, var(--engine)); }
.lightg .g-bar i { background: linear-gradient(90deg, #f5c542, var(--light)); }

#panel { padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); max-width: 620px; margin: 0 auto; }

@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 480px; min-height: 100vh; }
  .scene { position: sticky; top: 0; height: 100vh; max-height: none; grid-row: 1 / span 2; }
  .side { border-left: 1px solid var(--line); min-width: 0; }
  #panel { padding: 20px 24px 40px; }
}

/* ---------- controls ---------- */
.btn { display: block; width: 100%; text-align: center; text-decoration: none; margin: 10px 0; padding: 13px 14px; min-height: 48px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #032233; }
.btn.good { background: var(--good); border-color: var(--good); color: #04220f; }
.btn.bad { background: var(--bad); border-color: var(--bad); color: #2b0308; }
.btn.on { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .choice:focus-visible, .link:focus-visible, input:focus-visible, select:focus-visible, .topbar button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.link { background: none; border: 0; padding: 8px 4px; color: var(--accent); font-weight: 600; text-decoration: underline; }
.row { display: flex; gap: 10px; align-items: stretch; }
.row.two > * { flex: 1; margin: 6px 0; }
.row input { flex: 1; min-width: 0; }
.row .btn { width: auto; margin: 0; padding-left: 22px; padding-right: 22px; }
label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 12px 0 5px; }
input:not([type=checkbox]), select { width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: #06192b; font-size: 17px; }
label.check { display: flex; gap: 10px; align-items: center; font-size: 15px; font-weight: 500; color: var(--text); min-height: 40px; margin: 6px 0 0; }
label.check input { width: 22px; height: 22px; flex: none; accent-color: var(--accent); }
.error { color: var(--bad); font-weight: 600; min-height: 1.2em; margin: 8px 0 0; }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.foot { display: flex; justify-content: space-between; margin-top: 10px; }

/* ---------- start ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 14px; }
.stats.two { grid-template-columns: 1fr 1fr; }
.stats div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 6px; text-align: center; }
.stats b { display: block; font-size: 26px; line-height: 1.1; }
.stats span { font-size: 12px; color: var(--muted); }
.source { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; margin: 14px 0; }
.source.ok { border-color: var(--good); } .source.warn { border-color: var(--engine); }
.source .tiny { display: block; opacity: .7; word-break: break-word; }
details { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin: 12px 0; }
summary { font-weight: 700; cursor: pointer; }
details ul { padding-left: 1.2em; margin: 6px 0; }
.ladder { font-weight: 700; color: var(--accent); }

/* ---------- dive ---------- */
.progress { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
.pips { display: flex; gap: 5px; }
.pips i { width: 18px; height: 7px; border-radius: 9px; background: #17364f; }
.pips i.ok { background: var(--good); } .pips i.bad { background: var(--bad); } .pips i.now { background: var(--accent); }
.pips i:last-child { width: 26px; }
.mission { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 10px 14px; margin: 10px 0 12px; }
.mission.boss { border-left-color: var(--gold); }
.m-kicker { font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
.m-title { font-size: 17px; font-weight: 700; }
.m-part { font-size: 14px; color: var(--muted); margin-top: 4px; }
.m-part.on { color: var(--text); font-weight: 700; }
.loading { display: flex; align-items: center; gap: 12px; padding: 26px 4px; color: var(--muted); }
.sonar { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent); animation: sonar 1.2s ease-out infinite; flex: none; }
@keyframes sonar { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.passage, .stem, .review .rich { font-size: 17px; line-height: 1.5; }
.passage { background: var(--panel); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; max-height: 44vh; overflow: auto; }
.stem { margin: 10px 0 12px; font-weight: 600; }
.rich p { margin: 0 0 .6em; } .rich p:last-child { margin-bottom: 0; }
.rich img, .rich svg { max-width: 100%; height: auto; background: #fff; border-radius: 6px; }
.rich table { border-collapse: collapse; background: #fff; color: #111; margin: 6px 0; font-size: 15px; }
.rich td, .rich th { border: 1px solid #999; padding: 4px 8px; }
.rich ul, .rich ol { margin: .4em 0; padding-left: 1.3em; }
.rich { overflow-wrap: anywhere; }
.cover { background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius); padding: 6px 14px 8px; }
.choices { display: grid; gap: 9px; }
.choice { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; min-height: 52px; padding: 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel-2); }
.choice:hover { border-color: var(--accent); }
.choice b { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #06192b; border: 1px solid var(--line); font-size: 14px; }
.choice .rich { flex: 1; min-width: 0; }
.qid { font-size: 12px; color: var(--muted); margin-top: 12px; }

.result { text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 12px 0; }
.result.ok { border-color: var(--good); } .result.bad { border-color: var(--bad); }
.result h2 { margin: 2px 0; font-size: 24px; }
.result .pts { color: var(--muted); margin: 2px 0 6px; }
.result.ok .pts { color: var(--accent); font-weight: 700; }
.result canvas { width: 200px; height: 100px; max-width: 100%; background: radial-gradient(ellipse at center, #123a5c, #06192b 75%); border-radius: 12px; }
.breakdown { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; color: var(--muted); }
.review { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin: 12px 0; }
.review details { border: 0; padding: 0; margin: 8px 0 0; background: none; }
.review details .rich { margin-top: 6px; max-height: 40vh; overflow: auto; font-size: 15px; }

/* ---------- end ---------- */
.final { text-align: center; background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); padding: 12px; }
.final span, .final small { display: block; color: var(--muted); font-size: 13px; }
.final b { font-size: 56px; line-height: 1.05; display: block; }
.final em { display: inline-block; font-style: normal; font-weight: 800; color: #2b2200; background: var(--gold); border-radius: 99px; padding: 2px 10px; font-size: 12px; margin-bottom: 4px; }
.collected { display: flex; flex-wrap: wrap; gap: 8px; }
.collected figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
.collected canvas { width: 100px; height: 50px; display: block; background: radial-gradient(ellipse at center, #123a5c, #06192b 75%); border-radius: 10px; }
table.missions { width: 100%; border-collapse: collapse; font-size: 14px; }
table.missions td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.missions td:first-child { color: var(--muted); width: 1.6em; }
table.missions td:nth-child(3) { white-space: nowrap; font-weight: 600; }
table.missions td:last-child { text-align: right; font-weight: 800; }
table.missions small { display: block; color: var(--muted); }
.tip { background: var(--panel); border-left: 4px solid var(--light); border-radius: 10px; padding: 10px 12px; }

/* ---------- skill map and history ---------- */
.legend { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-right: -4px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { border-radius: 12px; padding: 10px; border: 1px solid transparent; }
.tile b { display: block; font-size: 14px; line-height: 1.25; }
.tile span { font-size: 12px; opacity: .9; }
.c-none { background: #12304b; border-color: var(--line); color: var(--muted); }
.c-low { background: #7a2331; color: #fff; } .c-mid { background: #7a5a12; color: #fff; } .c-high { background: #17693f; color: #fff; }
.history { list-style: none; padding: 0; margin: 10px 0; }
.history li { display: flex; gap: 12px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--line); }
.history li > b { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #04121f; }
.history li.ok > b { background: var(--good); } .history li.bad > b { background: var(--bad); }
.history code { font-size: 15px; font-weight: 700; user-select: all; }
.history small { display: block; color: var(--muted); font-size: 12px; }

@media (prefers-reduced-motion: reduce) { .reveal, .g-bar i { transition: none; } .sonar { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="scene">
    <canvas id="sea" aria-hidden="true"></canvas>
    <div class="topbar">
      <button class="brand" data-go="home">Twin Tank Dive</button>
      <nav>
        <button data-go="map">Skill Map</button>
        <button data-go="history">History</button>
        <button id="mute" aria-pressed="true">Sound on</button>
      </nav>
    </div>
    <div class="reveal" id="reveal" aria-live="polite"></div>
    <div class="zone" id="zone">Sunlit Reef</div>
  </div>
  <div class="side">
    <div class="gauges">
      <div class="gauge engine">
        <div class="g-head"><span>Engine · Math</span><b id="g-engine">0</b></div>
        <div class="g-bar"><i id="gb-engine"></i></div>
      </div>
      <div class="gauge lightg">
        <div class="g-head"><span>Light · English</span><b id="g-light">0</b></div>
        <div class="g-bar"><i id="gb-light"></i></div>
      </div>
    </div>
    <main id="panel"></main>
  </div>
</div>
<noscript>Twin Tank Dive needs JavaScript turned on.</noscript>
<script src="skills.js"></script>
<script src="game.js"></script>
</body>
</html>
